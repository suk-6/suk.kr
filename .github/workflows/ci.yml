name: CI

on:
  pull_request:
  push:
    branches: [main, v2]

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          API_BASE_URL: http://localhost:8787
          API_TOKEN: build-placeholder
          ADMIN_PASSWORD: build-placeholder
          SESSION_SECRET: build-placeholder
          S3_REGION: ap-northeast-2
          S3_BUCKET_NAME: build-placeholder
          S3_ACCESS_KEY: build-placeholder
          S3_SECRET_KEY: build-placeholder
          NEXT_PUBLIC_S3_URL: https://file.suk.kr
